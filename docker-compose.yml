# Levanta toda la plataforma backend:
#   cp .env.example .env && docker compose up -d --build
# Swagger agregado: http://localhost:${GATEWAY_HOST_PORT}/swagger-ui.html (por defecto 8080)   |   Jaeger: http://localhost:16686
name: periferia-social

x-service-common: &service-common
  env_file: .env
  restart: unless-stopped
  networks: [ social-net ]

services:
  postgres:
    image: postgres:16-alpine
    container_name: social-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env (cp .env.example .env)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: postgres
      POSTGRES_MULTIPLE_DATABASES: auth_db,post_db,feed_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [ social-net ]

  kafka:
    image: apache/kafka:3.9.1
    container_name: social-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 15
    networks: [ social-net ]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: social-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    networks: [ social-net ]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: social-kafka-ui
    profiles: [ tools ]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks: [ social-net ]

  auth-service:
    <<: *service-common
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    image: periferia-social/auth-service:1.0.0
    container_name: social-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  post-service:
    <<: *service-common
    build:
      context: .
      dockerfile: post-service/Dockerfile
    image: periferia-social/post-service:1.0.0
    container_name: social-post-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  feed-service:
    <<: *service-common
    build:
      context: .
      dockerfile: feed-service/Dockerfile
    image: periferia-social/feed-service:1.0.0
    container_name: social-feed-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  api-gateway:
    <<: *service-common
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    image: periferia-social/api-gateway:1.0.0
    container_name: social-api-gateway
    environment:
      GATEWAY_PORT: 8080 # puerto interno fijo (healthcheck del Dockerfile)
    ports:
      - "${GATEWAY_HOST_PORT:-8080}:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
      feed-service:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  social-net:
    name: periferia-social-net
